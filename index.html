<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="按目标院校题型与分值生成真题练习卷。"><title>不随机鹦鹉｜新传考研真题工具</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="public.css"><link rel="stylesheet" href="redesign.css"><style>body{font-family:"IBM Plex Sans","Microsoft YaHei",system-ui,sans-serif}.qtools details{min-width:0}.qtools details span{display:block;overflow-wrap:anywhere}@media(max-width:480px){h1{font-size:24px;line-height:32px}}</style></head><body>
<div class="app-shell"><aside class="sidebar" id="sidebar"><div><a class="brand" href="#setup"><span>不随机鹦鹉</span><small>新传考研真题工具</small></a><nav><button class="nav-item active" id="navMock">真题组卷</button><button class="nav-item dev-only" id="navSimilar">相似院校</button></nav></div><button class="quiet" id="scopeButton">题库与来源说明</button></aside>
<main><header class="mobile-head"><button id="menuButton" aria-label="打开菜单">菜单</button><b>真题组卷</b></header><section class="setup" id="setup"><div class="heading"><div><h1>真题组卷</h1><p>按目标院校题型与分值生成真题练习卷。</p></div></div>
<div class="mode-tabs" role="tablist"><button id="modeMock" class="active" role="tab" aria-selected="true">模考组卷</button><button id="modeHistory" role="tab" aria-selected="false">历年真题</button></div>
<div class="selection-box"><div class="controls"><label>目标院校<select id="schoolSelect"></select></label><label>科目组合<select id="pairSelect"></select></label></div><p class="reference-note">参照2026年真题结构</p><button id="generateButton">生成模考卷</button></div><p class="status" id="processNote" aria-live="polite"></p>
<div class="templates" id="templates"><article id="templateOne"></article><article id="templateTwo"></article></div></section>
<section class="history is-hidden" id="historySection"><div class="year-row"><span>年份</span><div id="yearTags"></div></div><div class="subject-tabs" id="historySubjectTabs"></div><div id="historyView"></div></section>
<section class="result is-hidden" id="resultSection"><div class="result-head"><div><h2>模考卷</h2><p id="resultSummary">由其他院校真题组卷</p></div><button id="regenerateButton">重新组卷</button></div><div class="subject-tabs"><button id="tabOne" class="active">专业课一</button><button id="tabTwo">专业课二</button></div><div id="paperView"></div></section>
<section class="similar-page is-hidden" id="similarPage"><div class="heading"><h1>相似院校</h1><p>根据目标试卷的内容、作答任务与题型结构，推荐其他院校真题。</p></div><div class="selection-box"><div class="controls similar-controls"><label>目标院校<select id="similarSchool"></select></label><label>目标试卷<select id="similarPaper"></select></label></div><button id="recommendButton">查看推荐</button></div><p class="status" id="recommendStatus" aria-live="polite"></p><div class="recommend-results is-hidden" id="recommendResults"><div class="recommend-heading"><div><h2 id="recommendTitle">推荐结果</h2><p id="recommendSubtitle"></p></div></div><div class="recommend-list" id="recommendList"></div></div></section></main></div>
<dialog id="scopeDialog"><button class="dialog-close" id="scopeClose">关闭</button><h2>题库与来源说明</h2><p>候选题来自已完成人工核验与分类的 2026 年真题。来源科目代码仅用于回查，不作为候选限制。</p><p>套卷分值采用目标卷模板。原题分值保留在来源信息中，不直接照搬。</p></dialog>
<style>.sidebar .nav-item{width:100%;border:0;text-align:left;font-weight:500}.sidebar .nav-item.active{font-weight:600}.similar-page{max-width:1180px;margin:0 auto}.similar-controls{margin-bottom:16px}#recommendButton{min-width:160px;background:var(--ink);color:#fff;border-color:var(--ink)}.recommend-results{margin-top:40px}.recommend-heading p{margin:6px 0 0;color:var(--muted)}.recommend-list{display:grid;gap:12px;margin-top:20px}.recommend-card{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;padding:20px;border:1px solid var(--line);border-radius:8px}.recommend-rank{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--soft);font-weight:600}.recommend-card-head{display:flex;justify-content:space-between;gap:20px}.recommend-card h3{margin:0;font-size:18px}.recommend-card-head p{margin:3px 0 0;color:var(--muted)}.recommend-card-head strong{font-size:20px;color:var(--accent);white-space:nowrap}.recommend-reason{margin:16px 0 0}.recommend-card details{margin-top:12px;color:var(--muted)}.recommend-card details p{margin:8px 0 0}@media(max-width:480px){.recommend-card{grid-template-columns:32px minmax(0,1fr);padding:16px;gap:12px}.recommend-rank{width:30px;height:30px}.recommend-card-head{display:block}.recommend-card-head strong{display:block;margin-top:8px}}</style>
<script src="data.js"></script><script src="recommendations.js"></script><script src="app.js"></script><script src="public.js"></script><script src="redesign.js"></script></body></html>
